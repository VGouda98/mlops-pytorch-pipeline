apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-storage
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---

apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training
  namespace: ml-training
  labels:
    app: cifar10-training

spec:
  backoffLimit: 2

  template:
    metadata:
      labels:
        app: cifar10-training

    spec:
      restartPolicy: Never

      nodeSelector:
        accelerator: nvidia-gpu

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: trainer
          image: mlops-pytorch-train:latest
          imagePullPolicy: Never

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            
            - name: TRAINING_CONFIG
              value: /app/configs/training_config.yaml

          volumeMounts:
            - name: training-config
              mountPath: /app/configs/training_config.yaml
              subPath: training_config.yaml

            - name: training-storage
              mountPath: /app/data
              subPath: data

            - name: training-storage
              mountPath: /app/checkpoints
              subPath: checkpoints

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"

      volumes:
        - name: training-config
          configMap:
            name: training-config

        - name: training-storage
          persistentVolumeClaim:
            claimName: training-storage

