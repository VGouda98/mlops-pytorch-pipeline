apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar10-serving
  namespace: ml-training
  labels:
    app: cifar10-serving

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: cifar10-serving

  template:
    metadata:
      labels:
        app: cifar10-serving

    spec:
      containers:
        - name: server
          image: mlops-pytorch-serve:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MODEL_PATH
              value: /app/checkpoints/classifier_v1.pt

          volumeMounts:
            - name: training-storage
              mountPath: /app/checkpoints
              subPath: checkpoints
              readOnly: true

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

      volumes:
        - name: training-storage
          persistentVolumeClaim:
            claimName: training-storage